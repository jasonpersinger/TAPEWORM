[package]
name = "tapeworm"
version = "0.1.0"
edition = "2021"
authors = ["MESSYQUEST <info@messy.quest>"]
license = "GPL-3.0-or-later"
description = "TAPEWORM: Vintage Lo-Fi Cassette & Dungeon Synth Tape Processor for DAWs"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
atomic_float = "1.1"
miniz_oxide = "0.9"

[features]
default = ["gui"]
gui = ["nih_plug_egui"]

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
