[package]
name = "tw_clap_host"
version = "0.1.0"
edition = "2021"
publish = false

# Independent black-box CLAP host written for the TAPEWORM final certification.
# It loads a shipped .clap binary through the CLAP ABI only; it does not link
# TAPEWORM source. clap-sys is pinned to the same revision nih-plug uses.
[dependencies]
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }
libloading = "0.8"

[profile.release]
opt-level = 3
debug = false

[workspace]
